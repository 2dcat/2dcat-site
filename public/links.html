    animation: fadeIn 0.7s ease both 0.25s;

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function getFbc() {
  const cookie = getCookie('_fbc');
  if (cookie) return cookie;
  const fbclid = new URLSearchParams(location.search).get('fbclid');
  if (fbclid) return 'fb.1.' + Date.now() + '.' + fbclid;

  return false;
}

// ─── Fire conversion via Worker ───────────────────────────────────────────────
async function fireConversion(eventName) {
  if (isLikelyBot()) return;

  const payload = {
    event_name: eventName,
    fbc: getFbc(),
    fbp: getCookie('_fbp'),
    user_agent: navigator.userAgent,
    page_url: location.href,
    timestamp: Math.floor(Date.now() / 1000)
  };

  try {
    await fetch(CAPI_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      keepalive: true
    });
  } catch(e) {}
}

// ─── Fire click tracking ──────────────────────────────────────────────────────
function trackClick(linkName) {
  try {
    fetch(CLICKS_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link: linkName }),
      keepalive: true
    });
  } catch(e) {}
}

// ─── PageView on load ─────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  fireConversion('PageView');
});

// ─── ViewContent on Spotify click + track all links ──────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  const linkMap = {
    'btn-spotify':  'spotify',
    'btn-apple':    'apple-music',
    'btn-shows':    'live-shows',
    'btn-youtube':  'youtube',
    'btn-merch':    'merch',
    'btn-bandcamp': 'bandcamp',
    'btn-instagram':'instagram',
    'btn-facebook': 'facebook',
    'btn-website':  'official-website'
  };

  Object.entries(linkMap).forEach(([id, name]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', function() {
      trackClick(name);
      if (id === 'btn-spotify') fireConversion('ViewContent');
    });
  });
});
</script>
